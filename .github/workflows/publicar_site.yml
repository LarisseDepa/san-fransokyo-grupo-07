# Monta o site (pasta site/) e publica no GitHub Pages a cada push.
# Antes, uma vez só: no GitHub, Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Também dá para rodar à mão: aba Actions -> "Publicar site no GitHub Pages" -> "Run workflow".
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# só uma publicação por vez; uma nova não cancela a que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    name: Montar o site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o pixi e o ambiente do projeto (pixi.lock)
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.68.1
          cache: true
          locked: true

      - name: Rodar os notebooks e montar a pasta site/
        run: pixi run site

      # se algum teste falhar (dados, modelo, recomendações ou o site no Chrome), nada é publicado
      - name: Rodar os testes automáticos
        run: pixi run testes

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar a pasta site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    name: Publicar
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
